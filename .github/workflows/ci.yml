name: CI

# Every push and pull request: backend unit tests, the sandbox (virtual Steam Deck runs of the
# pilot, Governor, Power Split and GPU clock ceiling), the committed frontend build and its
# smoke test. Hardware numbers come only from a Steam Deck, never from here.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Sandbox scenarios
        if: ${{ !cancelled() }}
        # Preserve raw FAIL; the mandatory scoped gate below decides admission.
        continue-on-error: true
        run: python3 -m sandbox.run --report "$RUNNER_TEMP/SANDBOX_REPORT.md" --json "$RUNNER_TEMP/sandbox.json"
      - name: Seeded virtual Deck stress
        if: ${{ !cancelled() }}
        run: python3 -m sandbox.stress --seeds 30 --json "$RUNNER_TEMP/stress.json"
      # The current run is supplied twice: this gate checks the historical baseline against
      # this commit; the separate three-way tool supports a pinned stable run as well.
      - name: Check baseline scenario assertions
        if: always()
        # Preserve raw FAIL; the mandatory scoped gate below decides admission.
        continue-on-error: true
        run: python3 tools/compare_sandbox.py docs/baseline-3.2.2/sandbox.json "$RUNNER_TEMP/sandbox.json" "$RUNNER_TEMP/sandbox.json" --output "$RUNNER_TEMP/comparison.json"
      - name: Review historical sandbox source changes
        if: always()
        run: python3 tools/guard_sandbox_source.py docs/baseline-3.2.2/sandbox-run.py.txt sandbox/run.py --output "$RUNNER_TEMP/source-comparison.json"
      - name: Execute all protected 3.2.2 scenarios against candidate
        if: ${{ !cancelled() }}
        # Preserve raw FAIL; the mandatory scoped gate below decides admission.
        continue-on-error: true
        run: python3 -B tools/run_historical_sandbox.py --output "$RUNNER_TEMP/historical-sandbox.json"
      - name: Enforce owner-approved LCD60 candidate scope
        if: ${{ !cancelled() }}
        run: python3 -B tools/candidate_scope_gate.py --current "$RUNNER_TEMP/sandbox.json" --historical "$RUNNER_TEMP/historical-sandbox.json" --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/candidate-scope.json"
      - name: Save simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-deck-results
          path: |
            ${{ runner.temp }}/SANDBOX_REPORT.md
            ${{ runner.temp }}/sandbox.json
            ${{ runner.temp }}/stress.json
            ${{ runner.temp }}/comparison.json
            ${{ runner.temp }}/source-comparison.json
            ${{ runner.temp }}/candidate-scope.json
            ${{ runner.temp }}/historical-sandbox.json
          if-no-files-found: warn
      - name: Frontend build is committed and current
        if: ${{ !cancelled() }}
        run: |
          npm ci
          npm run build
          git diff --exit-code dist/index.js || { echo "::error::dist/index.js is stale; run npm run build and commit"; exit 1; }
      - name: Frontend smoke test
        if: ${{ !cancelled() }}
        run: |
          npx playwright-core install --with-deps chromium
          node frontend/harness/smoke.mjs

  candidate-package-fixture:
    # Packaging/provenance only: these fixture files are not an engine build.
    runs-on: ubuntu-24.04
    env:
      KEDAVRA_REPO: wavessevaw/GSF_Kedavra
      KEDAVRA_SHA: f13e66cee6b0934d9b90a273e78253502ba64042
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.KEDAVRA_REPO }}
          ref: ${{ env.KEDAVRA_SHA }}
          path: kedavra-source
      - name: Parse release workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml"); puts "release YAML parsed"'
      - name: Exercise candidate packaging with non-executable fixtures
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/candidate-fixture"
          mkdir -p "$fixture/runtime/bin" "$fixture/runtime/lib" "$fixture/bench"
          printf 'fixture, not gamescope\n' > "$fixture/runtime/bin/gamescope"
          printf 'fixture, not a loader\n' > "$fixture/runtime/lib/ld-linux-x86-64.so.2"
          printf 'fixture, not a benchmark\n' > "$fixture/bench/kfg_vktest"
          printf 'fixture, not a shader\n' > "$fixture/bench/fixture.spv"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export TAG="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if TAG=v0.0.0 bash scripts/package_candidate.sh kedavra-source "$fixture/runtime" "$fixture/bench" "$fixture/bad-version"; then echo 'version mismatch was accepted' >&2; exit 1; fi
          if KEDAVRA_SHA=0000000000000000000000000000000000000000 bash scripts/package_candidate.sh kedavra-source "$fixture/runtime" "$fixture/bench" "$fixture/bad-engine"; then echo 'engine mismatch was accepted' >&2; exit 1; fi
          test ! -e "$fixture/bad-version" && test ! -e "$fixture/bad-engine"
          bash scripts/package_candidate.sh kedavra-source "$fixture/runtime" "$fixture/bench" "$fixture/out"
          python3 -c 'import json, os, pathlib; m=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"candidate-fixture/out/BUILD_MANIFEST.json").read_text()); assert m["gfg_sha"] == os.environ["GITHUB_SHA"] and m["gsf_sha"] == os.environ["KEDAVRA_SHA"] and m["gamescope_sha"] == "aa289ea5977d8b21b92b0f246f0e8f0c225d180f" and m["candidate_version"] == os.environ["TAG"]'
