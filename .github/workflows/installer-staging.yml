name: Installer staging checks

# Fake-root tests and an isolated file-capability check only; no device validation.
on:
  pull_request:
    paths:
      - 'py_modules/gfg_plugin/kedavra/install.py'
      - 'py_modules/gfg_plugin/kedavra/system_profile.py'
      - 'tests/test_install_upgrade_recovery.py'
      - 'tests/test_install_interruption.py'
      - 'tests/test_system_profile.py'
      - '.github/workflows/installer-staging.yml'

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check installer recovery on a fake root
        env:
          PYTHONPATH: tests:py_modules
        run: |
          python -m unittest -v test_install_upgrade_recovery
          python -m unittest -v test_install_interruption
      - name: Check system profile watchdog and restoration on a fake root
        env:
          PYTHONPATH: tests:py_modules
        run: |
          python -m unittest -v test_system_profile
      - name: Verify file capability survives directory rename
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/runtime.new/bin"
          cp /bin/true "$root/runtime.new/bin/gamescope"
          sudo setcap cap_sys_nice=eip "$root/runtime.new/bin/gamescope"
          mv "$root/runtime.new" "$root/runtime"
          getcap "$root/runtime/bin/gamescope" | grep -Fx "$root/runtime/bin/gamescope cap_sys_nice=eip"

  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Virtual Deck scenarios
        continue-on-error: true
        run: python3 -m sandbox.run --report "$RUNNER_TEMP/sandbox.md" --json "$RUNNER_TEMP/sandbox.json"
      - name: Execute all protected historical scenarios
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -B tools/run_historical_sandbox.py --output "$RUNNER_TEMP/historical-sandbox.json"
      - name: Enforce owner-approved LCD60 candidate scope
        if: ${{ !cancelled() }}
        run: python3 -B tools/candidate_scope_gate.py --current "$RUNNER_TEMP/sandbox.json" --historical "$RUNNER_TEMP/historical-sandbox.json" --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/candidate-scope.json"
      - name: Virtual Deck stress with seeds 1 through 30
        if: always()
        run: python3 -m sandbox.stress --seeds 30 --json "$RUNNER_TEMP/stress.json"
      - name: Frontend build and committed bundle
        if: always()
        run: |
          npm ci
          npm run build
          git diff --exit-code dist/index.js
      - name: Frontend smoke
        if: always()
        run: |
          npx playwright-core install --with-deps chromium
          node frontend/harness/smoke.mjs
      - name: Save model observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-regression-simulation
          path: |
            ${{ runner.temp }}/sandbox.md
            ${{ runner.temp }}/sandbox.json
            ${{ runner.temp }}/stress.json
            ${{ runner.temp }}/historical-sandbox.json
            ${{ runner.temp }}/candidate-scope.json
          if-no-files-found: error
